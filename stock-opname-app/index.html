<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayam Bakareng - Owner Inventory v4</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#cc0000">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* BASE THEME - LUXURY DEEP CHARCOAL */
        :root {
            --bg-body: #101014;
            --bg-card: #1c1c24;
            --bg-accent: #cc0000;
            --bg-accent-gold: #D4AF37;
            --text-main: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: rgba(224, 224, 224, 0.1);
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-body); color: var(--text-main); position: relative; }

        /* SNOWFALL EFFECT */
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

        /* INTERACTIVE LOGO PACK (NEW) */
        .brand-panel { text-align: center; padding: 30px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; }
        .logo-main { width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 0 30px rgba(204, 0, 0, 0.6); margin-bottom: 15px; }
        .brand-name { color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; font-size: 1.2rem; }

        /* SIDENAV - LUXURY STYLE */
        .sidenav { height: 100%; width: 0; position: fixed; z-index: 200; top: 0; left: 0; background-color: rgba(20, 20, 28, 0.98); overflow-x: hidden; transition: var(--transition-speed); padding-top: 20px; border-right: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .sidenav a { padding: 15px 15px 15px 32px; text-decoration: none; font-size: 1.1rem; color: var(--text-secondary); display: block; transition: var(--transition-speed); display: flex; align-items: center; gap: 10px; border-radius: 8px; margin: 5px 10px; }
        .sidenav a:hover { background-color: rgba(204, 0, 0, 0.1); color: #fff; transform: scale(1.02); }
        .sidenav .closebtn { position: absolute; top: 10px; right: 25px; font-size: 30px; color: var(--bg-accent); }

        /* HEADER */
        .header { background: var(--bg-card); color: white; padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; top: 0; z-index: 150; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .header h1 { font-size: 1rem; color: #fff; margin: 0; flex: 1; }
        .openbtn { font-size: 24px; cursor: pointer; color: var(--bg-accent); position: absolute; left: 15px; top: 15px; transition: var(--transition-speed); }
        .openbtn:active { transform: scale(1.2) rotate(90deg); }

        /* DASHBOARD CARDS & ANIMATION */
        .main { margin-top: 80px; padding: 15px; margin-left: 0; transition: margin-left .5s; position: relative; z-index: 5; }
        .cards { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 15px; padding: 20px; text-align: center; width: 100%; transition: var(--transition-speed); position: relative; overflow: hidden; }
        
        /* HOVER INTERACTIVE ANIMATION */
        .card:hover { transform: scale(1.02); border-color: var(--bg-accent-gold); box-shadow: 0 5px 25px rgba(212, 175, 55, 0.2); }
        .card:active { transform: scale(0.98); }

        .card h2 { font-size: 1rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .card span { font-size: 2.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
        .card.main-val span { color: #fff; }
        .card.active span { color: var(--bg-accent); text-shadow: 0 0 15px rgba(204, 0, 0, 0.8); }

        /* BRANCH PANELS */
        .panels-cabang { display: flex; flex-wrap: wrap; gap: 15px; }
        .panel { flex: 1; min-width: 100%; background: var(--bg-card); border-radius: 15px; padding: 15px; border: 1px solid var(--border-color); position: relative; transition: var(--transition-speed); }
        
        /* INTERACTIVE PANEL HOVER */
        .panel:hover { border-color: rgba(204, 0, 0, 0.5); transform: scale(1.01); box-shadow: 0 5px 20px rgba(204, 0, 0, 0.1); }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; }
        .panel-header h2 { font-size: 1.1rem; color: #fff; text-transform: uppercase; font-weight: 700; }
        .card.stock span { color: var(--bg-accent); }

        /* LIST & CHIP */
        .data-list { list-style: none; }
        .data-list li { border-bottom: 1px solid var(--border-color); padding: 12px 0; font-size: 0.95rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; transition: var(--transition-speed); border-radius: 8px; }
        
        /* HOVER INTERACTIVE LIST */
        .data-list li:hover { background-color: rgba(224, 224, 224, 0.03); transform: scale(1.02); }

        .item-val { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .chip { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; position: relative; overflow: hidden; }
        
        .chip::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.2), rgba(255,255,255,0.1)); animation: shimmy 3s infinite; }
        
        .chip.masuk { background-color: rgba(0, 150, 0, 0.2); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.3); }
        .chip.keluar { background-color: rgba(204, 0, 0, 0.2); color: #ff0000; border: 1px solid rgba(255, 0, 0, 0.3); }

        /* BUTTONS */
        .btn-update { background-color: var(--bg-accent); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: var(--transition-speed); text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; width: 100%; margin-bottom: 20px; }
        
        /* INTERACTIVE BUTTON HOVER */
        .btn-update:hover { background-color: #ff0000; transform: scale(1.02) translateY(-2px); box-shadow: 0 5px 20px rgba(204, 0, 0, 0.5); }
        .btn-update:active { transform: scale(0.98); }

        @media (min-width: 600px) { .card { width: calc(33.33% - 10px); } .panel { min-width: calc(33.33% - 10px); } }
        @media (min-width: 900px) { .main { margin-left: 280px; } .sidenav { width: 280px; left: 0; } .openbtn { display: none; } }

        @keyframes shimmy { 100% { left: 100%; } }
    </style>
</head>
<body>
    
    <canvas id="snow-canvas"></canvas>

    <div class="header">
        <span class="openbtn" onclick="toggleNav()">☰</span>
        <h1>AYAM BAKARENG - Owner v4</h1>
    </div>

    <div id="mySidenav" class="sidenav">
        <div class="brand-panel">
            <img src="logo.png" alt="Ayam Bakareng Logo" class="logo-main">
            <div class="brand-name">BAKARENG</div>
        </div>
        <a href="javascript:void(0)" class="closebtn" onclick="toggleNav()">×</a>
        <a href="#serdam" onclick="toggleNav()"><span style="color: var(--bg-accent-gold);">⚡</span> Cabang Serdam</a>
        <a href="#suwignyo" onclick="toggleNav()"><span style="color: var(--bg-accent-gold);">⚡</span> Cabang Suwignyo</a>
        <a href="#tani" onclick="toggleNav()"><span style="color: var(--bg-accent-gold);">⚡</span> Cabang Tani</a>
    </div>

    <div class="main" id="main-content">
        <button class="btn-update" onclick="loadAllData()">⚡ Sync Seluruh Data</button>
        
        <div class="cards">
            <div class="card active stock"><h2>Current Stock</h2><span id="allStock">--</span></div>
            <div class="card main-val"><h2>In (This Week)</h2><span id="allIn">--</span></div>
            <div class="card main-val"><h2>Out (This Week)</h2><span id="allOut">--</span></div>
        </div>

        <div class="panels-cabang">
            <div class="panel" id="serdam"><div class="panel-header"><h2>Cabang Serdam</h2><div class="card stock active"><span></span> <span id="serdamCurrentStock">--</span></div></div><ul class="data-list" id="serdamList"><li>Loading...</li></ul></div>
            <div class="panel" id="suwignyo"><div class="panel-header"><h2>Cabang Suwignyo</h2><div class="card stock active"><span></span> <span id="suwignyoCurrentStock">--</span></div></div><ul class="data-list" id="suwignyoList"><li>Loading...</li></ul></div>
            <div class="panel" id="tani"><div class="panel-header"><h2>Cabang Tani</h2><div class="card stock active"><span></span> <span id="taniCurrentStock">--</span></div></div><ul class="data-list" id="taniList"><li>Loading...</li></ul></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // KODE SAKTI SINKRONISASI PEMILIH CABANG v4
        const s=["/serdam.html","/suwignyo.html","/tani.html"],
        l=JSON.parse(localStorage.getItem('brc'))||[];
        const u=location.pathname.replace('index.html','');
        if(s.includes(u)&&!l.includes(u)){let r=prompt('KODE SAKTI CABANG:');if(r==='BAKARENGOK'){l.push(u);localStorage.setItem('brc',JSON.stringify(l));}else{alert('SALAH KODE! Kembali ke Owner.');location.href='index.html';}}
    </script>
    <script>
        // FIREBASE CONFIG - TETAP SAMA DAN AMAN
        const firebaseConfig = { apiKey: "AIzaSyCaH89A1-zerbNoNn4kdHLEMEkGRKcPY5Q", authDomain: "ayam-bakareng-e8c3e.firebaseapp.com", databaseURL: "https://ayam-bakareng-e8c3e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "ayam-bakareng-e8c3e", storageBucket: "ayam-bakareng-e8c3e.firebasestorage.app", messagingSenderId: "86767748720", appId: "1:86767748720:web:62ce7000429383a36156b5" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleNav() { const nav = document.getElementById("mySidenav"); const main = document.getElementById("main-content"); if (nav.style.width === "280px" || (window.innerWidth >= 900 && nav.style.width === "")) { nav.style.width = "0"; main.style.marginLeft = "0"; } else { nav.style.width = "280px"; if (window.innerWidth >= 900) main.style.marginLeft = "280px"; } }
        if (window.innerWidth >= 900) toggleNav();

        function createListItem(item, type, quantity) { const displayQty = `${item[type].toString().padStart(2,'0')}/${quantity.toString().padStart(2,'0')}`; const time = new Date(item.waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); return `<li><div><strong>Ayam</strong></div><div class="item-val"><span class="chip ${type === 'masuk' ? 'masuk' : 'keluar'}">${displayQty} ${type}</span> ${time}</div></li>`; }
        function calculateWeeklyData(dataList) { const now = new Date(); const oneWeekAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000); return dataList.filter(item => new Date(item.waktu).getTime() > oneWeekAgo); }
        async function loadBranchData(branchName, listId, stockId) { db.ref(branchName).once('value', snapshot => { const listElement = document.getElementById(listId); listElement.innerHTML = ''; let currentStock = 0; let rawData = []; snapshot.forEach(item => { const data = item.val(); if(data.tipe && data.jumlah !== undefined) { currentStock += (data.tipe === 'masuk' ? parseInt(data.jumlah) : -parseInt(data.jumlah)); rawData.push(data); } }); rawData.sort((a,b)=> new Date(b.waktu) - new Date(a.waktu)); const latestData = rawData.slice(0, 5); if(latestData.length === 0) { listElement.innerHTML = '<li>Belum ada data terbaru</li>'; } else { latestData.forEach(item => { let tempStock = currentStock; listElement.innerHTML += createListItem(item, item.tipe, tempStock); if(item.tipe === 'masuk') tempStock -= parseInt(item.jumlah); else tempStock += parseInt(item.jumlah); }); } document.getElementById(stockId).innerText = `${currentStock.toString().padStart(2,'0')} kg`; }); }
        async function loadAllData() { loadBranchData('Serdam', 'serdamList', 'serdamCurrentStock'); loadBranchData('Suwignyo', 'suwignyoList', 'suwignyoCurrentStock'); loadBranchData('Tani', 'taniList', 'taniCurrentStock'); }
        loadAllData(); setInterval(loadAllData, 60000);

        // SNOWFALL JAVASCRIPT (NEW EFFECT)
        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const flakes = [];
            function Snowflake() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2.5 + 0.5; this.speed = Math.random() * 1.5 + 0.5; this.opacity = Math.random() * 0.5 + 0.3; }
            Snowflake.prototype.update = function() { this.y += this.speed; if (this.y > canvas.height) { this.y = -this.size; this.x = Math.random() * canvas.width; } }
            Snowflake.prototype.draw = function() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.random() * Math.PI * 2); ctx.fill(); }
            for (let i = 0; i < 70; i++) { flakes.push(new Snowflake()); }
            function animateSnow() { ctx.clearRect(0, 0, canvas.width, canvas.height); flakes.forEach(flake => { flake.update(); flake.draw(); }); requestAnimationFrame(animateSnow); }
            animateSnow();
            window.addEventListener('resize', function() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        })();
    </script>
</body>
</html>
