<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karyawan v4 - Ayam Bakareng Serdam</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#cc0000">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* BASE THEME - LUXURY DEEP CHARCOAL */
        :root {
            --bg-body: #101014;
            --bg-card: #1c1c24;
            --bg-accent: #cc0000;
            --bg-accent-gold: #D4AF37;
            --text-main: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: rgba(224, 224, 224, 0.1);
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; position: relative; }

        /* SNOWFALL EFFECT */
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

        /* INTERACTIVE LOGO LOGIN (NEW) */
        .brand-panel { text-align: center; padding: 20px 0; display: flex; flex-direction: column; align-items: center; }
        .logo-main { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 30px rgba(204, 0, 0, 0.7); margin-bottom: 20px; }
        .brand-name { color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; font-size: 1.3rem; margin-bottom: 30px; }

        /* UI CONTAINERS & TRANSITIONS */
        .ui-screen { display: none; height: 100%; width: 100%; overflow-y: auto; padding: 20px; opacity: 0; transition: opacity var(--transition-speed); position: relative; z-index: 10; }
        .ui-screen.active { display: block; opacity: 1; }

        /* INPUTS - LUXURY STYLE */
        input, select { background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; font-size: 1.1rem; width: 100%; margin-bottom: 20px; font-family: inherit; transition: var(--transition-speed); }
        
        /* INTERACTIVE INPUT HOVER/FOCUS */
        input:focus, select:focus { outline: none; border-color: var(--bg-accent); box-shadow: 0 0 15px rgba(204, 0, 0, 0.3); background: rgba(255,255,255,0.05); }
        
        /* BUTTONS */
        .btn-update { background-color: var(--bg-accent); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: var(--transition-speed); text-transform: uppercase; letter-spacing: 1px; font-size: 1rem; width: 100%; }
        
        /* INTERACTIVE BUTTON HOVER */
        .btn-update:hover { background-color: #ff0000; transform: translateY(-3px) scale(1.02); box-shadow: 0 5px 25px rgba(204, 0, 0, 0.6); }
        .btn-update:active { transform: scale(0.98); }

        .form-group h2 { text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1.5px; font-size: 0.9rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    
    <canvas id="snow-canvas"></canvas>

    <div id="loginScreen" class="ui-screen active">
        <div style="height: 15vh;"></div>
        <div class="brand-panel">
            <img src="logo.png" alt="Ayam Bakareng Logo" class="logo-main">
            <div class="brand-name">BAKARENG</div>
        </div>
        <input type="password" id="accessKodeSakti" placeholder="Masukkan Kode Sakti Cabang OK">
        <button class="btn-update" onclick="submitLoginSaktiOK()">⚡ Masuk</button>
    </div>

    <div id="inputScreen" class="ui-screen">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="logo.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%;">
        </div>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="text-transform: uppercase; color: var(--text-secondary); letter-spacing: 2px; font-size: 0.8rem; margin-bottom: 5px;">Halaman Input</div>
            <h1 style="color: #fff; font-weight: 700;">CABANG Serdam OK</h1>
        </div>

        <div class="form-group"><h2>Jenis Barang</h2><input type="text" value="Ayam (kg)" readonly style="font-weight: bold; color: var(--bg-accent-gold);"></div>
        <div class="form-group"><h2>Tipe Transaksi</h2><select id="dataTipe"><option value="masuk">Ayam MASUK (+)</option><option value="keluar">Ayam KELUAR (-)</option></select></div>
        <div class="form-group"><h2>Jumlah (kg)</h2><input type="number" id="dataJumlah" placeholder="Masukkan jumlah kg OK (contoh: 5)"></div>
        <button class="btn-update" onclick="kirimStockOKToFirebase()">⚡ Submit Stock OK</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // FIREBASE CONFIG - AMAN DAN TETAP
        const firebaseConfig = { apiKey: "AIzaSyCaH89A1-zerbNoNn4kdHLEMEkGRKcPY5Q", authDomain: "ayam-bakareng-e8c3e.firebaseapp.com", databaseURL: "https://ayam-bakareng-e8c3e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "ayam-bakareng-e8c3e", storageBucket: "ayam-bakareng-e8c3e.firebasestorage.app", messagingSenderId: "86767748720", appId: "1:86767748720:web:62ce7000429383a36156b5" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const CABANG = "Serdam"; // Nama database ruangan cabang Serdam OK

        function switchScreenOK(id) { document.querySelectorAll('.ui-screen').forEach(s=>s.classList.remove('active')); const next = document.getElementById(id); next.classList.add('active'); }
        function submitLoginSaktiOK() { const k = document.getElementById('accessKodeSakti').value; if(k==='BAKARENGOK'){ sessionStorage.setItem('cbrcOK_serdam','ok'); switchScreenOK('inputScreen'); } else { alert('SALAH KODE OK!'); } }
        if(sessionStorage.getItem('cbrcOK_serdam')==='ok') switchScreenOK('inputScreen');

        function kirimStockOKToFirebase() { 
            const t = document.getElementById('dataTipe').value; 
            const j = document.getElementById('dataJumlah').value; 
            if(j && j > 0) { 
                const now = new Date();
                db.ref(CABANG).push({ tipe: t, jumlah: parseInt(j), waktu: now.toISOString() }, function(e) { if(e) { alert('GAGAL KIRIM OK!'); } else { alert('STOCK OK BERHASIL!'); document.getElementById('dataJumlah').value=''; kirimWA_OK(CABANG, t, j, now); } }); 
            } else { alert('ISI JUMLAH DULU OK!'); } 
        }

        function kirimWA_OK(c, t, j, w) { 
            const timeStr = w.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const pesan_ok = `⚡ *LAPORAN OK STOCK AYAM* ⚡%0ACabang: ${c}%0A----------------------%0A📋 Ayam: *${j} kg*%0A➡️ Status: *${t.toUpperCase()}*%0A----------------------%0A(Waktu OK: ${timeStr})`; 
            window.open(`https://wa.me/6285821482667?text=${pesan_ok}`); // Nomor WA Mas Ary sudah benar
        }

        // SNOWFALL JAVASCRIPT EFFECT
        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const flakes = [];
            function Snowflake() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 0.5; this.speed = Math.random() * 1.2 + 0.5; this.opacity = Math.random() * 0.4 + 0.3; }
            Snowflake.prototype.update = function() { this.y += this.speed; if (this.y > canvas.height) { this.y = -this.size; this.x = Math.random() * canvas.width; } }
            Snowflake.prototype.draw = function() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.random() * Math.PI * 2); ctx.fill(); }
            for (let i = 0; i < 50; i++) { flakes.push(new Snowflake()); }
            function animateSnow() { ctx.clearRect(0, 0, canvas.width, canvas.height); flakes.forEach(flake => { flake.update(); flake.draw(); }); requestAnimationFrame(animateSnow); }
            animateSnow();
            window.addEventListener('resize', function() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        })();
    </script>
</body>
</html>
